[workspace]
resolver = "3"
members = [
    "crates/sememe",
    "crates/sememe-bridge",
    "apps/sememe-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sourceblender/sememe"
authors = ["The sememe authors"]

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312", "auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# Profile used by `dist` for release binaries.
[profile.dist]
inherits = "release"
