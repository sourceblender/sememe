[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "sememe-bridge"
version = "0.0.0"
description = "PyO3 bridge for the sememe debug harness."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "crates/sememe-bridge/Cargo.toml"
module-name = "sememe_bridge"
features = ["pyo3/abi3-py312"]
strip = true