[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "sememe"
version = "0.0.0"
description = "An interactive debugger for PyTorch models"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["textual>=8.2.8,<9"]

[project.optional-dependencies]
torch = [
    "torch>=2.14,<3",
    "transformers>=5.18,<6",
    "huggingface-hub>=1.33,<2",
]

[project.scripts]
sememe = "sememe.ui.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
